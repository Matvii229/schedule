<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Розклад та Домашнє завдання</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 16px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    h1 {
      text-align: center;
      font-size: 22px;
      color: #007aff;
      margin-bottom: 20px;
    }
    .days-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
      padding-bottom: 4px;
    }
    .day-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: #e4e4e7;
      color: #333;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .day-btn.active {
      background: #007aff;
      color: #ffffff;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .subject-name {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      border: 1px solid #d1d1d6;
      border-radius: 8px;
      padding: 8px;
      box-sizing: border-box;
      font-size: 14px;
      resize: vertical;
      font-family: inherit;
    }
    .save-btn {
      margin-top: 8px;
      padding: 8px 14px;
      background: #34c759;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .save-btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <h1>📅 Розклад занять</h1>
  
  <div class="days-nav" id="daysNav"></div>
  <div id="scheduleContainer"></div>

  <script>
    const scheduleData = {
      "Пн": ["Пара 1: Предмет", "Пара 2: Предмет", "Пара 3: Предмет"],
      "Вт": ["Пара 1: Предмет", "Пара 2: Предмет", "Пара 3: Предмет"],
      "Ср": ["Пара 1: Предмет", "Пара 2: Предмет", "Пара 3: Предмет"],
      "Чт": ["Пара 1: Предмет", "Пара 2: Предмет", "Пара 3: Предмет"],
      "Пт": ["Пара 1: Предмет", "Пара 2: Предмет", "Пара 3: Предмет"]
    };

    let selectedDay = "Пн";

    function renderDays() {
      const nav = document.getElementById('daysNav');
      nav.innerHTML = '';
      Object.keys(scheduleData).forEach(day => {
        const btn = document.createElement('button');
        btn.className = `day-btn ${day === selectedDay ? 'active' : ''}`;
        btn.innerText = day;
        btn.onclick = () => {
          selectedDay = day;
          renderDays();
          renderSchedule();
        };
        nav.appendChild(btn);
      });
    }

    function renderSchedule() {
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';
      const subjects = scheduleData[selectedDay] || [];

      subjects.forEach((subject, index) => {
        const key = `hw_${selectedDay}_${index}`;
        const savedHw = localStorage.getItem(key) || '';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="subject-name">${index + 1}. ${subject}</div>
          <textarea id="${key}" placeholder="Запишіть домашнє завдання тут...">${savedHw}</textarea>
          <button class="save-btn" onclick="saveHomework('${key}')">Зберегти ДЗ</button>
        `;
        container.appendChild(card);
      });
    }

    function saveHomework(key) {
      const val = document.getElementById(key).value;
      localStorage.setItem(key, val);
      alert('Домашнє завдання збережено!');
    }

    renderDays();
    renderSchedule();
  </script>

</body>
</html>
